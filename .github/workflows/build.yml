# Windows (.msi + .exe), macOS (.dmg, Intel + Apple Silicon) ve Linux (.AppImage, .deb, .rpm)
# paketlerini GitHub'ın makinelerinde derler.
#
# Çalıştırma:
#   - Elle: GitHub > Actions > build > "Run workflow"  → paketler "Artifacts" altında
#   - Sürüm: git tag v0.1.0 && git push --tags        → paketler bir GitHub Release'e eklenir

name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            bundles: msi,nsis
          - name: macOS (universal)
            os: macos-latest
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: app,dmg
          - name: Linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu
            bundles: appimage,deb,rpm

    steps:
      - uses: actions/checkout@v4

      - name: Linux bağımlılıkları
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev patchelf file

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      - name: Tespit motoru testleri
        run: cargo test -p homoglyph_core

      - name: Derle ve paketle
        working-directory: src-tauri
        env:
          NO_STRIP: "true"
        run: tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Paketleri yükle (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: homoglyph-guard-${{ runner.os }}
          if-no-files-found: error
          path: |
            target/${{ matrix.target }}/release/bundle/msi/*.msi
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/rpm/*.rpm

      - name: GitHub Release'e ekle
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            target/${{ matrix.target }}/release/bundle/msi/*.msi
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/rpm/*.rpm
