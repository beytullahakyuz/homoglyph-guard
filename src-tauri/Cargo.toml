[package]
name = "homoglyph-guard"
version = "0.1.0"
edition = "2021"
description = "Panoya kopyalanan URL'lerdeki sahte alan adlarını tespit eder"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
homoglyph_core = { path = "../core", features = ["serde"] }
tauri = { version = "2.1", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
arboard = { version = "3", features = ["wayland-data-control"] }
